syntax = "proto3";

package task;
option go_package = "github.com/yourusername/go-task-mgmt/proto";

service TaskService {
  rpc GetAllTasks(GetAllTasksRequest) returns (GetAllTasksResponse);
}

message GetAllTasksRequest {
  int32 page = 1;
  int32 limit = 2;
  map<string, string> filters = 3;
}

message GetAllTasksResponse {
  bool success = 1;
  repeated Task tasks = 2;
  Pagination pagination = 3;
  string error = 4;
}

message Task {
  int64 Id = 1;
  string topic = 2;
  string data = 3;
  string status = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  string error_message = 7;
}

message Pagination {
  int32 current_page = 1;
  int32 total_pages = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}